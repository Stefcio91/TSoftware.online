<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 215" width="800" height="215" role="img" aria-label="3D print order process" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="g1dzwc05-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="g1dzwc05-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="g1dzwc05-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="g1dzwc05-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="g1dzwc05-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="g1dzwc05-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="g1dzwc05-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="g1dzwc05-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="g1dzwc05-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="g1dzwc05-frame"><rect width="800" height="215" rx="18"/></clipPath>
</defs>
<g clip-path="url(#g1dzwc05-frame)">
  <rect width="800" height="215" fill="#0b1222"/>
  <rect width="800" height="215" fill="url(#g1dzwc05-grid)"/>
  <rect width="800" height="215" fill="url(#g1dzwc05-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">FROM ENQUIRY TO THE PART IN YOUR HAND</text><rect x="30" y="70" width="142" height="86" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="44" y="70" width="114" height="3" rx="1.5" fill="#ffb547"/><text x="101" y="105.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">File or sketch</text><text x="101" y="130.1" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">STL, STEP, 3MF, photo with dimensions</text><path d="M174 113 L194 113" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g1dzwc05-arr)"/><rect x="196" y="70" width="142" height="86" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="210" y="70" width="114" height="3" rx="1.5" fill="#a78bfa"/><text x="267" y="105.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Modelling</text><text x="267" y="130.1" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">only without a file; preview to approve</text><path d="M340 113 L360 113" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g1dzwc05-arr)"/><rect x="362" y="70" width="142" height="86" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="376" y="70" width="114" height="3" rx="1.5" fill="#ffb547"/><text x="433" y="105.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Quote and lead time</text><text x="433" y="130.1" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">usually the same day</text><path d="M506 113 L526 113" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g1dzwc05-arr)"/><rect x="528" y="70" width="142" height="86" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="542" y="70" width="114" height="3" rx="1.5" fill="#ffb547"/><text x="599" y="105.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Printing on 2 machines</text><text x="599" y="130.1" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">PLA, PETG, TPU, ABS, ASA</text><path d="M672 113 L692 113" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g1dzwc05-arr)"/><rect x="694" y="70" width="142" height="86" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="708" y="70" width="114" height="3" rx="1.5" fill="#ffb547"/><text x="765" y="105.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Pickup or parcel</text><text x="765" y="130.1" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">STEP/STL file stays with you</text><text x="30" y="190" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">Spare part without a file: day 1 photo and dimensions, day 2 model and print, day 3 parcel. With a file, one day less.</text>
</g>
<rect x="0.5" y="0.5" width="799" height="214" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>