<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 275" width="800" height="275" role="img" aria-label="3D printing job types: material and time" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="gmtflzd-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="gmtflzd-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="gmtflzd-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="gmtflzd-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="gmtflzd-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="gmtflzd-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="gmtflzd-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="gmtflzd-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="gmtflzd-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="gmtflzd-frame"><rect width="800" height="275" rx="18"/></clipPath>
</defs>
<g clip-path="url(#gmtflzd-frame)">
  <rect width="800" height="275" fill="#0b1222"/>
  <rect width="800" height="275" fill="url(#gmtflzd-grid)"/>
  <rect width="800" height="275" fill="url(#gmtflzd-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">FOUR KINDS OF JOBS</text><rect x="30" y="60" width="177" height="190" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="44" y="60" width="149" height="3" rx="1.5" fill="#ffb547"/><text x="44" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffb547" text-anchor="start">Spare parts</text><circle cx="50" cy="118" r="3" fill="#ffb547"/><text x="61" y="122" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">latches, knobs, holders</text><circle cx="50" cy="150" r="3" fill="#ffb547"/><text x="61" y="154" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">PETG, ABS, ASA</text><circle cx="50" cy="182" r="3" fill="#ffb547"/><text x="61" y="186" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">1–3 days</text><circle cx="50" cy="214" r="3" fill="#ffb547"/><text x="61" y="218" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">usually without a file</text><rect x="217" y="60" width="177" height="190" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="231" y="60" width="149" height="3" rx="1.5" fill="#78a2ff"/><text x="231" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#78a2ff" text-anchor="start">Prototypes</text><circle cx="237" cy="118" r="3" fill="#78a2ff"/><text x="248" y="122" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">housings, parts before a mould</text><circle cx="237" cy="150" r="3" fill="#78a2ff"/><text x="248" y="154" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">PLA, PETG</text><circle cx="237" cy="182" r="3" fill="#78a2ff"/><text x="248" y="186" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">2–4 days with modelling</text><circle cx="237" cy="214" r="3" fill="#78a2ff"/><text x="248" y="218" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">3 iterations a week</text><rect x="404" y="60" width="177" height="190" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="418" y="60" width="149" height="3" rx="1.5" fill="#22e5ff"/><text x="418" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#22e5ff" text-anchor="start">Mounts and brackets</text><circle cx="424" cy="118" r="3" fill="#22e5ff"/><text x="435" y="122" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">sensors, cameras, scanners</text><circle cx="424" cy="150" r="3" fill="#22e5ff"/><text x="435" y="154" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">PETG, ASA</text><circle cx="424" cy="182" r="3" fill="#22e5ff"/><text x="435" y="186" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">1–2 days</text><circle cx="424" cy="214" r="3" fill="#22e5ff"/><text x="435" y="218" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">for a specific profile</text><rect x="591" y="60" width="177" height="190" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="605" y="60" width="149" height="3" rx="1.5" fill="#3ddc84"/><text x="605" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3ddc84" text-anchor="start">Runs and gadgets</text><circle cx="611" cy="118" r="3" fill="#3ddc84"/><text x="622" y="122" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">from 1 to a few hundred</text><circle cx="611" cy="150" r="3" fill="#3ddc84"/><text x="622" y="154" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">PLA, TPU</text><circle cx="611" cy="182" r="3" fill="#3ddc84"/><text x="622" y="186" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">about a week</text><circle cx="611" cy="214" r="3" fill="#3ddc84"/><text x="622" y="218" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#eef2ff" text-anchor="start">both printers in parallel</text>
</g>
<rect x="0.5" y="0.5" width="799" height="274" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>