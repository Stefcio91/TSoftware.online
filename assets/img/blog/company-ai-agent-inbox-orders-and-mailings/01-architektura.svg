xt><line x1="567.9716052859296" y1="332.12673601384523" x2="493.99086894320556" y2="262.2098163243916" stroke="#78a2ff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><rect x="60" y="350" width="180" height="64" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="74" y="350" width="152" height="3" rx="1.5" fill="#ff4d8d"/><text x="150" y="374.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Owner's WhatsApp</text><text x="150" y="399.09999999999997" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">urgent + 6:00 report</text><line x1="232.02839471407032" y1="332.12673601384523" x2="306.00913105679444" y2="262.2098163243916" stroke="#ff4d8d" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><rect x="20" y="215" width="180" height="64" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="34" y="215" width="152" height="3" rx="1.5" fill="#3ddc84"/><text x="110" y="239.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Mailing (Brevo)</text><text x="110" y="264.09999999999997" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">segments, sending, UTM</text><line x1="205.83547740876682" y1="241.3820582208654" x2="290.18851546912134" y2="233.6282540656911" stroke="#3ddc84" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
