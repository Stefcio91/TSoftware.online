<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="One day from the agent's log" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="gvp78x3-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="gvp78x3-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="gvp78x3-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="gvp78x3-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="gvp78x3-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="gvp78x3-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="gvp78x3-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="gvp78x3-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="gvp78x3-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="gvp78x3-frame"><rect width="800" height="560" rx="18"/></clipPath>
</defs>
<g clip-path="url(#gvp78x3-frame)">
  <rect width="800" height="560" fill="#0b1222"/>
  <rect width="800" height="560" fill="url(#gvp78x3-grid)"/>
  <rect width="800" height="560" fill="url(#gvp78x3-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">ONE TUESDAY FROM THE AGENT'S LOG</text><line x1="118" y1="72" x2="118" y2="516" stroke="rgba(255,255,255,0.18)" stroke-width="2"/><circle cx="118" cy="82" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="87" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">06:00</text><text x="142" y="88" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Daily report to the owner's WhatsApp</text><text x="142" y="109" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">3 installs, 2 overdue invoices, 1 open complaint</text><circle cx="118" cy="140" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="145" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">08:10</text><text x="142" y="146" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Email order → ZK in Subiekt</text><text x="142" y="167" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">160 × 80 desk × 6 pcs, known client, contract discount</text><circle cx="118" cy="198" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="203" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">09:30</text><text x="142" y="204" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Enquiry for 20 desks: quote draft for approval</text><text x="142" y="225" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">list prices, date from the production calendar</text><circle cx="118" cy="256" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="261" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">11:00</text><text x="142" y="262" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Mailing to 1,240 firms (segment: offices of 20+)</text><text x="142" y="283" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">sent via Brevo, UTM links, list minus anyone who unsubscribed</text><circle cx="118" cy="314" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="319" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">11:40</text><text x="142" y="320" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Mailing replies: sorting</text><text x="142" y="341" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">interested / question / not now / unsubscribe; each gets a task</text><circle cx="118" cy="372" r="9" fill="#0b1222" stroke="#ffb547" stroke-width="3"/><text x="84" y="377" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">14:05</text><text x="142" y="378" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Complaint: passed to Marek, 24 h deadline</text><text x="142" y="399" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ffb547" text-anchor="start">the agent never answers complaints itself, it summarises and tracks the deadline</text><circle cx="118" cy="430" r="9" fill="#0b1222" stroke="#ff4d8d" stroke-width="3"/><text x="84" y="435" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">15:20</text><text x="142" y="436" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Agent “invented” a delivery date</text><text x="142" y="457" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff4d8d" text-anchor="start">client was told “by Friday”, ERP said 2 weeks. Since then, dates come only from ERP.</text><circle cx="118" cy="488" r="9" fill="#0b1222" stroke="#3ddc84" stroke-width="3"/><text x="84" y="493" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">17:30</text><text x="142" y="494" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Wrap-up: 14 tasks handed out, 3 waiting for a decision</text>
</g>
<rect x="0.5" y="0.5" width="799" height="559" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>