  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">THE 11:00 MAILING, COUNTED ALL THE WAY (30 DAYS)</text><text x="30" y="82.8" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Sent</text><rect x="190" y="66" width="490" height="24" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="190" y="66" width="490" height="24" rx="6" fill="url(#g7oksig-neonbar)"/><text x="692" y="82.8" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">1,240</text><text x="30" y="118.8" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Opened</text><rect x="190" y="102" width="490" height="24" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="190" y="102" width="242" height="24" rx="6" fill="url(#g7oksig-neonbar)"/><text x="444" y="118.8" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">612 · 49%</text><text x="30" y="154.8" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Replies</text><rect x="190" y="138" width="490" height="24" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="190" y="138" width="38" height="24" rx="6" fill="url(#g7oksig-okbar)"/><text x="240" y="154.8" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">97 · 7.8%</text><text x="30" y="190.8" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Quote requests</text><rect x="190" y="174" width="490" height="24" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="190" y="174" width="9" height="24" rx="6" fill="url(#g7oksig-okbar)"/><text x="211" y="190.8" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">23</text><text x="30" y="226.8" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Orders</text><rect x="190" y="210" width="490" height="24" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="190" y="210" width="6" height="24" rx="6" fill="url(#g7oksig-okbar)"/><text x="208" y="226.8" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">6 · PLN 41k</text><text x="30" y="262" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#eef2ff" text-anchor="start">How the agent sorted the 97 replies:</text><rect x="30" y="274" width="122" height="26" rx="13" fill="#3ddc8422" stroke="#3ddc84" stroke-opacity="0.6"/><text x="91" y="291.32" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" fill="#3ddc84" text-anchor="middle" letter-spacing="0.8">interested 23</text><rect x="162" y="274" width="106" height="26" rx="13" fill="#78a2ff22" stroke="#78a2ff" stroke-opacity="0.6"/><text x="215" y="291.32" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" fill="#78a2ff" text-anchor="middle" letter-spacing="0.8">question 31</text><rect x="278" y="274" width="99" height="26" rx="13" fill="#93a0c422" stroke="#93a0c4" stroke-opacity="0.6"/><text x="327.5" y="291.32" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" fill="#93a0c4" text-anchor="middle" letter-spacing="0.8">not now 29</text><rect x="387" y="274" width="130" height="26" rx="13" fill="#ff4d8d22" stroke="#ff4d8d" stroke-opacity="0.6"/><text x="452" y="291.32" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" fill="#ff4d8d" text-anchor="middle" letter-spacing="0.8">unsubscribe 14</text><text x="30" y="322" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">Before, the firm only knew the number sent. “Not now” gets a reminder in 60 days, “unsubscribe” leaves the list that day.</text>
