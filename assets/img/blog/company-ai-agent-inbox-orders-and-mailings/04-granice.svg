<g clip-path="url(#g13pkgm3-frame)">
  <rect width="800" height="325" fill="#0b1222"/>
  <rect width="800" height="325" fill="url(#g13pkgm3-grid)"/>
  <rect width="800" height="325" fill="url(#g13pkgm3-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">BOUNDARIES WE SET IN THE FIRST WEEK</text><rect x="30" y="60" width="240" height="240" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="44" y="60" width="212" height="3" rx="1.5" fill="#3ddc84"/><text x="46" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#3ddc84" text-anchor="start">On its own</text><circle cx="52" cy="118" r="3" fill="#3ddc84"/><text x="64" y="122" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">orders from regulars → ZK</text><circle cx="52" cy="154" r="3" fill="#3ddc84"/><text x="64" y="158" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">sorting and summarising emails</text><circle cx="52" cy="190" r="3" fill="#3ddc84"/><text x="64" y="194" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">morning report, reminders</text><circle cx="52" cy="226" r="3" fill="#3ddc84"/><text x="64" y="230" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">mailing list segmentation</text><circle cx="52" cy="262" r="3" fill="#3ddc84"/><text x="64" y="266" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">mailing replies → tasks</text><rect x="280" y="60" width="240" height="240" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="294" y="60" width="212" height="3" rx="1.5" fill="#ffb547"/><text x="296" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffb547" text-anchor="start">Drafts, a human clicks</text><circle cx="302" cy="118" r="3" fill="#ffb547"/><text x="314" y="122" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">quotes and offers</text><circle cx="302" cy="154" r="3" fill="#ffb547"/><text x="314" y="158" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">replies to customers</text><circle cx="302" cy="190" r="3" fill="#ffb547"/><text x="314" y="194" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">mailing copy</text><circle cx="302" cy="226" r="3" fill="#ffb547"/><text x="314" y="230" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">orders from new clients</text><circle cx="302" cy="262" r="3" fill="#ffb547"/><text x="314" y="266" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">date changes</text><rect x="530" y="60" width="240" height="240" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="544" y="60" width="212" height="3" rx="1.5" fill="#ff4d8d"/><text x="546" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#ff4d8d" text-anchor="start">Never does</text><circle cx="552" cy="118" r="3" fill="#ff4d8d"/><text x="564" y="122" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">never answers complaints</text><circle cx="552" cy="154" r="3" fill="#ff4d8d"/><text x="564" y="158" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">no dates outside the ERP</text><circle cx="552" cy="190" r="3" fill="#ff4d8d"/><text x="564" y="194" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">no emails without consent</text><circle cx="552" cy="226" r="3" fill="#ff4d8d"/><text x="564" y="230" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">deletes nothing in the ERP</text><circle cx="552" cy="262" r="3" fill="#ff4d8d"/><text x="564" y="266" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">no talk about payments</text>
</g>
<rect x="0.5" y="0.5" width="799" height="324" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
