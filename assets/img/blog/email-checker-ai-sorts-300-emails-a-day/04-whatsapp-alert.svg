<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 403" width="800" height="403" role="img" aria-label="WhatsApp alert about an urgent email" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="gjzq4qz-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="gjzq4qz-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="gjzq4qz-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="gjzq4qz-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="gjzq4qz-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="gjzq4qz-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="gjzq4qz-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="gjzq4qz-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="gjzq4qz-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="gjzq4qz-frame"><rect width="800" height="403" rx="18"/></clipPath>
</defs>
<g clip-path="url(#gjzq4qz-frame)">
  <rect width="800" height="403" fill="#0b1222"/>
  <rect width="800" height="403" fill="url(#gjzq4qz-grid)"/>
  <rect width="800" height="403" fill="url(#gjzq4qz-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">URGENT MATTERS LAND ON THE OWNER'S WHATSAPP</text><text x="400" y="80" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">Tuesday, 8:12</text><path d="M40 96 h480 a10 10 0 0 1 10 10 v85 a10 10 0 0 1 -10 10 h-480 l-10 0 l10 -10 v-85 a10 10 0 0 1 10 -10z" fill="rgba(255,255,255,0.07)"/><text x="44" y="116" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#22e5ff" text-anchor="start">Checker · biuro@</text><text x="44" y="134" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">URGENT. Chłodnie Nowak is holding PLN 18,400</text><text x="44" y="155" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">until the unit is fixed. Service was Friday (Bartek).</text><text x="44" y="176" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Task: call back today. Email #4821, thread from 12 Sep.</text><text x="508" y="192" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">8:12</text><path d="M338 211 h422 a10 10 0 0 1 10 10 v27 a10 10 0 0 1 -10 10 h-422 a10 10 0 0 1 -10 -10 v-27 a10 10 0 0 1 10 -10z" fill="#1f3a5c"/><text x="352" y="233" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Calling now. Tell Bartek he's going there at 11.</text><text x="758" y="249" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">8:15</text><path d="M40 268 h422 a10 10 0 0 1 10 10 v85 a10 10 0 0 1 -10 10 h-422 l-10 0 l10 -10 v-85 a10 10 0 0 1 10 -10z" fill="rgba(255,255,255,0.07)"/><text x="44" y="288" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#22e5ff" text-anchor="start">Checker · biuro@</text><text x="44" y="306" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Done. Bartek has a calendar entry for 11:00,</text><text x="44" y="327" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Nowak got an email that we're coming today.</text><text x="44" y="348" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">I'll remind you at 16:00 if it's not closed out.</text><text x="450" y="364" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">8:15</text>
</g>
<rect x="0.5" y="0.5" width="799" height="402" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>