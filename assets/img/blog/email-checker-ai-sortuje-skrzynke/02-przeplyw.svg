00" fill="#eef2ff" text-anchor="middle">Szkic odpowiedzi</text><text x="400" y="285.09999999999997" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">pytania, jedno kliknięcie</text><path d="M630 142 L550 226" fill="none" stroke="#ff4d8d" stroke-width="2" marker-end="url(#g1wclsyh-arr)"/><rect x="480" y="230" width="140" height="76" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="494" y="230" width="112" height="3" rx="1.5" fill="#ff4d8d"/><text x="550" y="260.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">WhatsApp szefa</text><text x="550" y="285.09999999999997" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">pilne, w ciągu minuty</text><path d="M630 142 L700 226" fill="none" stroke="#5f6c8f" stroke-width="2" marker-end="url(#g1wclsyh-arr)" stroke-dasharray="6 6"/><rect x="630" y="230" width="140" height="76" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="644" y="230" width="112" height="3" rx="1.5" fill="#5f6c8f"/><text x="700" y="260.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Kosz</text><text x="700" y="285.09999999999997" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">spam, newslettery</text>
