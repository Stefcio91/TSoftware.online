<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 403" width="800" height="403" role="img" aria-label="Alert na WhatsApp o pilnym mailu" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="g1q2skdp-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="g1q2skdp-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="g1q2skdp-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="g1q2skdp-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="g1q2skdp-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="g1q2skdp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="g1q2skdp-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="g1q2skdp-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="g1q2skdp-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="g1q2skdp-frame"><rect width="800" height="403" rx="18"/></clipPath>
</defs>
<g clip-path="url(#g1q2skdp-frame)">
  <rect width="800" height="403" fill="#0b1222"/>
  <rect width="800" height="403" fill="url(#g1q2skdp-grid)"/>
  <rect width="800" height="403" fill="url(#g1q2skdp-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">PILNE SPRAWY LĄDUJĄ U WŁAŚCICIELA NA WHATSAPP</text><text x="400" y="80" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">wtorek, 8:12</text><path d="M40 96 h447 a10 10 0 0 1 10 10 v85 a10 10 0 0 1 -10 10 h-447 l-10 0 l10 -10 v-85 a10 10 0 0 1 10 -10z" fill="rgba(255,255,255,0.07)"/><text x="44" y="116" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#22e5ff" text-anchor="start">Checker · biuro@</text><text x="44" y="134" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">PILNE. Chłodnie Nowak wstrzymują płatność 18 400 zł</text><text x="44" y="155" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">do naprawy agregatu. Serwis był w piątek (Bartek).</text><text x="44" y="176" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Zadanie: oddzwonić dziś. Mail #4821, wątek z 12.09.</text><text x="475" y="192" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">8:12</text><path d="M387 211 h373 a10 10 0 0 1 10 10 v27 a10 10 0 0 1 -10 10 h-373 a10 10 0 0 1 -10 -10 v-27 a10 10 0 0 1 10 -10z" fill="#1f3a5c"/><text x="401" y="233" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Dzwonię. Daj Bartkowi, że jedzie tam o 11.</text><text x="758" y="249" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">8:15</text><path d="M40 268 h414 a10 10 0 0 1 10 10 v85 a10 10 0 0 1 -10 10 h-414 l-10 0 l10 -10 v-85 a10 10 0 0 1 10 -10z" fill="rgba(255,255,255,0.07)"/><text x="44" y="288" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#22e5ff" text-anchor="start">Checker · biuro@</text><text x="44" y="306" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Zrobione. Bartek ma wpis w kalendarzu na 11:00,</text><text x="44" y="327" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Nowak dostał maila, że dziś przyjeżdżamy.</text><text x="44" y="348" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Przypomnę o 16:00, jeśli nie będzie zamknięcia.</text><text x="442" y="364" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">8:15</text>
</g>
<rect x="0.5" y="0.5" width="799" height="402" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>