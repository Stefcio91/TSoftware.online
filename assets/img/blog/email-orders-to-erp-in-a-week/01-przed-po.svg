<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-label="Process before and after automation" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="gspd0wh-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="gspd0wh-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="gspd0wh-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="gspd0wh-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="gspd0wh-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="gspd0wh-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="gspd0wh-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="gspd0wh-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="gspd0wh-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="gspd0wh-frame"><rect width="800" height="390" rx="18"/></clipPath>
</defs>
<g clip-path="url(#gspd0wh-frame)">
  <rect width="800" height="390" fill="#0b1222"/>
  <rect width="800" height="390" fill="url(#gspd0wh-grid)"/>
  <rect width="800" height="390" fill="url(#gspd0wh-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#ff4d8d" text-anchor="start" letter-spacing="1.6">BEFORE: 26 MINUTES PER ORDER</text><rect x="30" y="58" width="134" height="78" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="44" y="58" width="106" height="3" rx="1.5" fill="#ff4d8d"/><text x="97" y="99.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Client's email</text><rect x="182" y="58" width="134" height="78" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="196" y="58" width="106" height="3" rx="1.5" fill="#ff4d8d"/><text x="249" y="88.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Sales rep reads</text><text x="249" y="113.30000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">and queries</text><rect x="334" y="58" width="134" height="78" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="348" y="58" width="106" height="3" rx="1.5" fill="#ff4d8d"/><text x="401" y="88.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Price hunt</text><text x="401" y="113.30000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">in list and memory</text><rect x="486" y="58" width="134" height="78" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="500" y="58" width="106" height="3" rx="1.5" fill="#ff4d8d"/><text x="553" y="88.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Types into Optima</text><text x="553" y="113.30000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">14 fields by hand</text><rect x="638" y="58" width="134" height="78" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="652" y="58" width="106" height="3" rx="1.5" fill="#ff4d8d"/><text x="705" y="88.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Replies</text><text x="705" y="113.30000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">to client</text><path d="M166 97 L180 97" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#gspd0wh-arr)"/><path d="M318 97 L332 97" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#gspd0wh-arr)"/><path d="M470 97 L484 97" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#gspd0wh-arr)"/><path d="M622 97 L636 97" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#gspd0wh-arr)"/><text x="30" y="168" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">Line by line, switching windows. 3 to 4 quantity mistakes a week.</text><text x="30" y="232" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#3ddc84" text-anchor="start" letter-spacing="1.6">AFTER: 4 SECONDS, A HUMAN ONLY FOR EXCEPTIONS</text><rect x="30" y="250" width="134" height="78" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="44" y="250" width="106" height="3" rx="1.5" fill="#3ddc84"/><text x="97" y="280.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Client's</text><text x="97" y="305.29999999999995" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">email</text><rect x="182" y="250" width="134" height="78" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="196" y="250" width="106" height="3" rx="1.5" fill="#3ddc84"/><text x="249" y="280.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">AI reads email</text><text x="249" y="305.29999999999995" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">+ PDF</text><rect x="334" y="250" width="134" height="78" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="348" y="250" width="106" height="3" rx="1.5" fill="#3ddc84"/><text x="401" y="280.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Checks VAT ID,</text><text x="401" y="305.29999999999995" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">prices, duplicates</text><rect x="486" y="250" width="134" height="78" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="500" y="250" width="106" height="3" rx="1.5" fill="#3ddc84"/><text x="553" y="280.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">ZK document</text><text x="553" y="305.29999999999995" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">in Optima via API</text><rect x="638" y="250" width="134" height="78" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="652" y="250" width="106" height="3" rx="1.5" fill="#3ddc84"/><text x="705" y="280.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">Confirmation</text><text x="705" y="305.29999999999995" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">+ note on Teams</text><path d="M166 289 L180 289" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#gspd0wh-arr)"/><path d="M318 289 L332 289" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#gspd0wh-arr)"/><path d="M470 289 L484 289" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#gspd0wh-arr)"/><path d="M622 289 L636 289" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#gspd0wh-arr)"/><text x="30" y="360" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">Exceptions (new client, item not in price list) get a draft and wait for one click.</text>
</g>
<rect x="0.5" y="0.5" width="799" height="389" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>