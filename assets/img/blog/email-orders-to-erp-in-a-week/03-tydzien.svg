<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Rollout timeline with the problems" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="g1001t0s-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="g1001t0s-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="g1001t0s-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="g1001t0s-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="g1001t0s-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="g1001t0s-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="g1001t0s-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="g1001t0s-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="g1001t0s-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="g1001t0s-frame"><rect width="800" height="560" rx="18"/></clipPath>
</defs>
<g clip-path="url(#g1001t0s-frame)">
  <rect width="800" height="560" fill="#0b1222"/>
  <rect width="800" height="560" fill="url(#g1001t0s-grid)"/>
  <rect width="800" height="560" fill="url(#g1001t0s-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">PLAN: 7 DAYS. TOOK: 9.</text><line x1="118" y1="72" x2="118" y2="516" stroke="rgba(255,255,255,0.18)" stroke-width="2"/><circle cx="118" cy="82" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="87" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">day 1</text><text x="142" y="88" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Review of the last 30 orders</text><text x="142" y="109" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">7 exception types listed, incl. “like last time”</text><circle cx="118" cy="140" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="145" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">day 2</text><text x="142" y="146" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Access set up, first flow on a test database</text><circle cx="118" cy="198" r="9" fill="#0b1222" stroke="#ff4d8d" stroke-width="3"/><text x="84" y="203" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">day 3</text><text x="142" y="204" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">First real emails</text><text x="142" y="225" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff4d8d" text-anchor="start">PDF scans: AI reads 60% of lines. We add OCR, a day lost.</text><circle cx="118" cy="256" r="9" fill="#0b1222" stroke="#ffb547" stroke-width="3"/><text x="84" y="261" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">day 4</text><text x="142" y="262" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Comparison with what a human entered</text><text x="142" y="283" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ffb547" text-anchor="start">discounts in the rep's head. Price list into Optima first.</text><circle cx="118" cy="314" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="319" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">day 5</text><text x="142" y="320" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Live start with manual approval</text><circle cx="118" cy="372" r="9" fill="#0b1222" stroke="#ff4d8d" stroke-width="3"/><text x="84" y="377" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">day 6</text><text x="142" y="378" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Duplicate order</text><text x="142" y="399" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff4d8d" text-anchor="start">client sent the same email twice. Duplicate check added.</text><circle cx="118" cy="430" r="9" fill="#0b1222" stroke="#ff4d8d" stroke-width="3"/><text x="84" y="435" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">Saturday</text><text x="142" y="436" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">API token expired at 3:14</text><text x="142" y="457" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff4d8d" text-anchor="start">queue stalled for 5 hours. Token auto-renewal and a WhatsApp alert.</text><circle cx="118" cy="488" r="9" fill="#0b1222" stroke="#3ddc84" stroke-width="3"/><text x="84" y="493" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">days 8–9</text><text x="142" y="494" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Approval switched off for 14 clients</text><text x="142" y="515" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#3ddc84" text-anchor="start">the ones that sprang no surprises all week</text>
</g>
<rect x="0.5" y="0.5" width="799" height="559" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>