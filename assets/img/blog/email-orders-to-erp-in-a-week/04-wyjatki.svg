<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Forms in which orders arrived" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="gthszz2-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="gthszz2-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="gthszz2-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="gthszz2-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="gthszz2-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="gthszz2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="gthszz2-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="gthszz2-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="gthszz2-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="gthszz2-frame"><rect width="800" height="280" rx="18"/></clipPath>
</defs>
<g clip-path="url(#gthszz2-frame)">
  <rect width="800" height="280" fill="#0b1222"/>
  <rect width="800" height="280" fill="url(#gthszz2-grid)"/>
  <rect width="800" height="280" fill="url(#gthszz2-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">30 ORDERS FROM LAST MONTH: WHAT FORM THEY CAME IN</text><text x="30" y="84.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Plain email text</text><rect x="260" y="66" width="420" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="260" y="66" width="420" height="26" rx="6" fill="url(#gthszz2-neonbar)"/><text x="692" y="84.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">21</text><text x="30" y="126.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">PDF from client's system</text><rect x="260" y="108" width="420" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="260" y="108" width="100" height="26" rx="6" fill="url(#gthszz2-neonbar)"/><text x="372" y="126.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">5</text><text x="30" y="168.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Photo or scan of a sheet</text><rect x="260" y="150" width="420" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="260" y="150" width="60" height="26" rx="6" fill="url(#gthszz2-pinkbar)"/><text x="332" y="168.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">3</text><text x="30" y="210.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">“Like last time”</text><rect x="260" y="192" width="420" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="260" y="192" width="20" height="26" rx="6" fill="url(#gthszz2-pinkbar)"/><text x="292" y="210.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">1</text><text x="30" y="250" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">The bottom two groups: 13% of orders, 70% of the problems.</text>
</g>
<rect x="0.5" y="0.5" width="799" height="279" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>