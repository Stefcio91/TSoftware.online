<g clip-path="url(#g1f53921-frame)">
  <rect width="800" height="560" fill="#0b1222"/>
  <rect width="800" height="560" fill="url(#g1f53921-grid)"/>
  <rect width="800" height="560" fill="url(#g1f53921-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">JEDEN WTOREK Z DZIENNIKA AGENTA</text><line x1="118" y1="72" x2="118" y2="516" stroke="rgba(255,255,255,0.18)" stroke-width="2"/><circle cx="118" cy="82" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="87" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">06:00</text><text x="142" y="88" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Raport dnia na WhatsApp właściciela</text><text x="142" y="109" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">3 montaże, 2 faktury po terminie, 1 reklamacja otwarta</text><circle cx="118" cy="140" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="145" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">08:10</text><text x="142" y="146" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Zamówienie z maila → ZK w Subiekcie</text><text x="142" y="167" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">biurko 160 × 80 × 6 szt., klient z kartoteki, rabat z umowy</text><circle cx="118" cy="198" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="203" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">09:30</text><text x="142" y="204" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Zapytanie o 20 biurek: szkic oferty do zatwierdzenia</text><text x="142" y="225" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">ceny z cennika, termin z kalendarza produkcji</text><circle cx="118" cy="256" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="261" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">11:00</text><text x="142" y="262" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Mailing do 1 240 firm (segment: biura 20+ osób)</text><text x="142" y="283" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">wysyłka z Brevo, linki z UTM, lista bez osób, które się wypisały</text><circle cx="118" cy="314" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="319" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">11:40</text><text x="142" y="320" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Odpowiedzi na mailing: sortowanie</text><text x="142" y="341" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">zainteresowany / pytanie / nie teraz / wypisz; każda z zadaniem</text><circle cx="118" cy="372" r="9" fill="#0b1222" stroke="#ffb547" stroke-width="3"/><text x="84" y="377" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">14:05</text><text x="142" y="378" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Reklamacja: przekazana do Marka, termin 24 h</text><text x="142" y="399" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ffb547" text-anchor="start">agent nie odpisuje na reklamacje sam, tylko streszcza i pilnuje terminu</text><circle cx="118" cy="430" r="9" fill="#0b1222" stroke="#ff4d8d" stroke-width="3"/><text x="84" y="435" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">15:20</text><text x="142" y="436" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Agent „wymyślił” termin dostawy</text><text x="142" y="457" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff4d8d" text-anchor="start">klient dostał „do piątku”, ERP mówił: 2 tygodnie. Od tego dnia terminy tylko z ERP.</text><circle cx="118" cy="488" r="9" fill="#0b1222" stroke="#3ddc84" stroke-width="3"/><text x="84" y="493" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">17:30</text><text x="142" y="494" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Podsumowanie: 14 zadań rozdane, 3 czekają na decyzję</text>
</g>
<rect x="0.5" y="0.5" width="799" height="559" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
