<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 325" width="800" height="325" role="img" aria-label="Co agent robi sam, co przygotowuje, czego nie robi" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="ghtqxl-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="ghtqxl-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="ghtqxl-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="ghtqxl-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="ghtqxl-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="ghtqxl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="ghtqxl-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="ghtqxl-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="ghtqxl-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="ghtqxl-frame"><rect width="800" height="325" rx="18"/></clipPath>
</defs>
<g clip-path="url(#ghtqxl-frame)">
  <rect width="800" height="325" fill="#0b1222"/>
  <rect width="800" height="325" fill="url(#ghtqxl-grid)"/>
  <rect width="800" height="325" fill="url(#ghtqxl-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">GRANICE, KTÓRE USTALILIŚMY W PIERWSZYM TYGODNIU</text><rect x="30" y="60" width="240" height="240" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="44" y="60" width="212" height="3" rx="1.5" fill="#3ddc84"/><text x="46" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#3ddc84" text-anchor="start">Robi sam</text><circle cx="52" cy="118" r="3" fill="#3ddc84"/><text x="64" y="122" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">zamówienia od stałych klientów → ZK</text><circle cx="52" cy="154" r="3" fill="#3ddc84"/><text x="64" y="158" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">sortowanie i streszczanie maili</text><circle cx="52" cy="190" r="3" fill="#3ddc84"/><text x="64" y="194" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">raport poranny, przypomnienia</text><circle cx="52" cy="226" r="3" fill="#3ddc84"/><text x="64" y="230" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">segmentacja listy mailingowej</text><circle cx="52" cy="262" r="3" fill="#3ddc84"/><text x="64" y="266" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">odpowiedzi na mailing → zadania</text><rect x="280" y="60" width="240" height="240" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="294" y="60" width="212" height="3" rx="1.5" fill="#ffb547"/><text x="296" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffb547" text-anchor="start">Przygotowuje, człowiek klika</text><circle cx="302" cy="118" r="3" fill="#ffb547"/><text x="314" y="122" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">oferty i wyceny</text><circle cx="302" cy="154" r="3" fill="#ffb547"/><text x="314" y="158" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">odpowiedzi do klientów</text><circle cx="302" cy="190" r="3" fill="#ffb547"/><text x="314" y="194" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">treść mailingu</text><circle cx="302" cy="226" r="3" fill="#ffb547"/><text x="314" y="230" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">zamówienia od nowych klientów</text><circle cx="302" cy="262" r="3" fill="#ffb547"/><text x="314" y="266" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">zmiany terminów</text><rect x="530" y="60" width="240" height="240" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="544" y="60" width="212" height="3" rx="1.5" fill="#ff4d8d"/><text x="546" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#ff4d8d" text-anchor="start">Nie robi w ogóle</text><circle cx="552" cy="118" r="3" fill="#ff4d8d"/><text x="564" y="122" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">nie odpisuje na reklamacje</text><circle cx="552" cy="154" r="3" fill="#ff4d8d"/><text x="564" y="158" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">nie podaje terminów spoza ERP</text><circle cx="552" cy="190" r="3" fill="#ff4d8d"/><text x="564" y="194" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">nie wysyła do osób bez zgody</text><circle cx="552" cy="226" r="3" fill="#ff4d8d"/><text x="564" y="230" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">nie kasuje niczego w ERP</text><circle cx="552" cy="262" r="3" fill="#ff4d8d"/><text x="564" y="266" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#eef2ff" text-anchor="start">nie rozmawia o płatnościach</text>
</g>
<rect x="0.5" y="0.5" width="799" height="324" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>