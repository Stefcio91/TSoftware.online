  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">TRZY PROCESY Z JEDNEJ FIRMY HANDLOWEJ (14 OSÓB)</text><text x="30" y="84.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Zamówienia z maila do ERP</text><rect x="280" y="66" width="400" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="280" y="66" width="354" height="26" rx="6" fill="url(#grkfgd9-neonbar)"/><text x="646" y="84.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">33,6 h · 2 300 zł</text><text x="30" y="126.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Faktury kosztowe do księgowości</text><rect x="280" y="108" width="400" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="280" y="108" width="332" height="26" rx="6" fill="url(#grkfgd9-neonbar)"/><text x="624" y="126.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">31,5 h · 2 200 zł</text><text x="30" y="168.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Te same pytania klientów</text><rect x="280" y="150" width="400" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="280" y="150" width="368" height="26" rx="6" fill="url(#grkfgd9-neonbar)"/><text x="660" y="168.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">35 h · 2 400 zł</text><line x1="30" y1="200" x2="770" y2="200" stroke="rgba(255,255,255,0.18)"/><text x="30" y="230" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start">Razem</text><text x="770" y="230" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ff4d8d" text-anchor="end">100 h · około 6 900 zł miesięcznie</text><text x="30" y="254" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">Ponad pół etatu na przepisywanie. Właściciel liczył „jakieś dwie, trzy godziny tygodniowo”.</text>
