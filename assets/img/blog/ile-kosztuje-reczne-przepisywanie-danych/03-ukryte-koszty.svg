<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 335" width="800" height="335" role="img" aria-label="Koszty widoczne i ukryte" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="g1qf143-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="g1qf143-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="g1qf143-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="g1qf143-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="g1qf143-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="g1qf143-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="g1qf143-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="g1qf143-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="g1qf143-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="g1qf143-frame"><rect width="800" height="335" rx="18"/></clipPath>
</defs>
<g clip-path="url(#g1qf143-frame)">
  <rect width="800" height="335" fill="#0b1222"/>
  <rect width="800" height="335" fill="url(#g1qf143-grid)"/>
  <rect width="800" height="335" fill="url(#g1qf143-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">CO WIDAĆ W EXCELU, A CO NIE</text><text x="30" y="76" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="start">Widać</text><rect x="130" y="60" width="640" height="26" rx="6" fill="url(#g1qf143-neonbar)"/><text x="140" y="78" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b1222" text-anchor="start">6 900 zł: czas pracy</text><text x="30" y="130" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ff4d8d" text-anchor="start">Błędy</text><rect x="130" y="112" width="180" height="26" rx="6" fill="#ff4d8d" opacity="0.28" stroke="#ff4d8d" stroke-dasharray="4 4"/><text x="320" y="130" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">zła ilość, zwrot, kurier w dwie strony: 2–3 razy w miesiącu</text><text x="30" y="176" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ff4d8d" text-anchor="start">Opóźnienia</text><rect x="130" y="158" width="120" height="26" rx="6" fill="#ff4d8d" opacity="0.28" stroke="#ff4d8d" stroke-dasharray="4 4"/><text x="260" y="176" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">zamówienie z 17:05 leży do rana, dostawa dzień później</text><text x="30" y="222" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ff4d8d" text-anchor="start">Koszt alternat.</text><rect x="130" y="204" width="300" height="26" rx="6" fill="#ff4d8d" opacity="0.28" stroke="#ff4d8d" stroke-dasharray="4 4"/><text x="440" y="222" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">handlowiec, który przepisuje, nie dzwoni; największa pozycja</text><text x="30" y="268" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ff4d8d" text-anchor="start">Rotacja</text><rect x="130" y="250" width="200" height="26" rx="6" fill="#ff4d8d" opacity="0.28" stroke="#ff4d8d" stroke-dasharray="4 4"/><text x="340" y="268" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">rekrutacja i wdrożenie nowej osoby co rok, dwa</text><text x="30" y="310" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">Słupki poniżej kreski to szacunki z rozmowy z właścicielem, nie z systemu. Dlatego są kreskowane.</text>
</g>
<rect x="0.5" y="0.5" width="799" height="334" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>