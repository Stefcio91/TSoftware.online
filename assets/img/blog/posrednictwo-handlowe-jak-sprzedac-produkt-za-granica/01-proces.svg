  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">CZTERY ETAPY POŚREDNICTWA</text><rect x="30" y="62" width="177" height="104" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="44" y="62" width="149" height="3" rx="1.5" fill="#ff4d8d"/><text x="118.5" y="99.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">1. Brief</text><text x="118.5" y="124.10000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">co, ile, za ile, na kiedy</text><text x="118.5" y="138.10000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">czego nie robisz</text><rect x="40" y="176" width="69" height="24.5" rx="12.25" fill="#93a0c422" stroke="#93a0c4" stroke-opacity="0.6"/><text x="74.5" y="192.03" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#93a0c4" text-anchor="middle" letter-spacing="0.8">Ty + ja</text><path d="M208 114 L216 114" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#gxp20bs-arr)"/><rect x="217" y="62" width="177" height="104" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="231" y="62" width="149" height="3" rx="1.5" fill="#ff4d8d"/><text x="305.5" y="99.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">2. Research i weryfikacja</text><text x="305.5" y="124.10000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">lista kandydatów, rejestry,</text><text x="305.5" y="138.10000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">referencje, próbki</text><rect x="227" y="176" width="35" height="24.5" rx="12.25" fill="#93a0c422" stroke="#93a0c4" stroke-opacity="0.6"/><text x="244.5" y="192.03" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#93a0c4" text-anchor="middle" letter-spacing="0.8">ja</text><path d="M395 114 L403 114" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#gxp20bs-arr)"/><rect x="404" y="62" width="177" height="104" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="418" y="62" width="149" height="3" rx="1.5" fill="#ff4d8d"/><text x="492.5" y="99.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">3. Rozmowy i negocjacje</text><text x="492.5" y="124.10000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">maile i spotkania w PL, EN, DE,</text><text x="492.5" y="138.10000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">warunki, umowa</text><rect x="414" y="176" width="136" height="24.5" rx="12.25" fill="#93a0c422" stroke="#93a0c4" stroke-opacity="0.6"/><text x="482" y="192.03" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#93a0c4" text-anchor="middle" letter-spacing="0.8">ja, Ty decydujesz</text><path d="M582 114 L590 114" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#gxp20bs-arr)"/><rect x="591" y="62" width="177" height="104" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="605" y="62" width="149" height="3" rx="1.5" fill="#3ddc84"/><text x="679.5" y="99.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">4. Pierwsza transakcja</text><text x="679.5" y="124.10000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">Incoterms, VAT UE, EORI,</text><text x="679.5" y="138.10000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">płatności, dostawa</text><rect x="601" y="176" width="150" height="24.5" rx="12.25" fill="#93a0c422" stroke="#93a0c4" stroke-opacity="0.6"/><text x="676" y="192.03" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#93a0c4" text-anchor="middle" letter-spacing="0.8">ja + Twoja księgowa</text><line x1="30" y1="222" x2="770" y2="222" stroke="rgba(255,255,255,0.18)"/><text x="30" y="248" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">Płatność: prowizja od wartości transakcji albo stała kwota za sam research. Nic z góry za „gotowość”.</text>
