<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="Stages of trade agency work" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="g1xxu097-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="g1xxu097-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="g1xxu097-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="g1xxu097-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="g1xxu097-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="g1xxu097-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="g1xxu097-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="g1xxu097-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="g1xxu097-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="g1xxu097-frame"><rect width="800" height="270" rx="18"/></clipPath>
</defs>
<g clip-path="url(#g1xxu097-frame)">
  <rect width="800" height="270" fill="#0b1222"/>
  <rect width="800" height="270" fill="url(#g1xxu097-grid)"/>
  <rect width="800" height="270" fill="url(#g1xxu097-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">FOUR STAGES OF AGENCY WORK</text><rect x="30" y="62" width="177" height="104" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="44" y="62" width="149" height="3" rx="1.5" fill="#ff4d8d"/><text x="118.5" y="99.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">1. Brief</text><text x="118.5" y="124.10000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">what, how much, at what price, when</text><text x="118.5" y="138.10000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">what you will not do</text><rect x="40" y="176" width="76" height="24.5" rx="12.25" fill="#93a0c422" stroke="#93a0c4" stroke-opacity="0.6"/><text x="78" y="192.03" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#93a0c4" text-anchor="middle" letter-spacing="0.8">you + me</text><path d="M208 114 L216 114" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g1xxu097-arr)"/><rect x="217" y="62" width="177" height="104" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="231" y="62" width="149" height="3" rx="1.5" fill="#ff4d8d"/><text x="305.5" y="99.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">2. Research and vetting</text><text x="305.5" y="124.10000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">candidate list, registers,</text><text x="305.5" y="138.10000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">references, samples</text><rect x="227" y="176" width="35" height="24.5" rx="12.25" fill="#93a0c422" stroke="#93a0c4" stroke-opacity="0.6"/><text x="244.5" y="192.03" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#93a0c4" text-anchor="middle" letter-spacing="0.8">me</text><path d="M395 114 L403 114" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g1xxu097-arr)"/><rect x="404" y="62" width="177" height="104" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="418" y="62" width="149" height="3" rx="1.5" fill="#ff4d8d"/><text x="492.5" y="99.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">3. Talks and negotiations</text><text x="492.5" y="124.10000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">emails and meetings in PL, EN, DE,</text><text x="492.5" y="138.10000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">terms, contract</text><rect x="414" y="176" width="116" height="24.5" rx="12.25" fill="#93a0c422" stroke="#93a0c4" stroke-opacity="0.6"/><text x="472" y="192.03" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#93a0c4" text-anchor="middle" letter-spacing="0.8">me, you decide</text><path d="M582 114 L590 114" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g1xxu097-arr)"/><rect x="591" y="62" width="177" height="104" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="605" y="62" width="149" height="3" rx="1.5" fill="#3ddc84"/><text x="679.5" y="99.9" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eef2ff" text-anchor="middle">4. First transaction</text><text x="679.5" y="124.10000000000001" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">Incoterms, EU VAT, EORI,</text><text x="679.5" y="138.10000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">payments, delivery</text><rect x="601" y="176" width="156" height="24.5" rx="12.25" fill="#93a0c422" stroke="#93a0c4" stroke-opacity="0.6"/><text x="679" y="192.03" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#93a0c4" text-anchor="middle" letter-spacing="0.8">me + your accountant</text><line x1="30" y1="222" x2="770" y2="222" stroke="rgba(255,255,255,0.18)"/><text x="30" y="248" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">Payment: a commission on the transaction value or a fixed fee for research only. Nothing upfront for &quot;readiness&quot;.</text>
</g>
<rect x="0.5" y="0.5" width="799" height="269" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>