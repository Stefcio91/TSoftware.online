<g clip-path="url(#gfupp1t-frame)">
  <rect width="800" height="285" fill="#0b1222"/>
  <rect width="800" height="285" fill="url(#gfupp1t-grid)"/>
  <rect width="800" height="285" fill="url(#gfupp1t-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">THE FORMULA ON ONE PROCESS: EMAIL ORDERS TO ERP</text><rect x="30" y="62" width="128" height="70" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="94" y="98" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="middle">12</text><text x="94" y="119" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">minutes each</text><text x="172" y="106" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#93a0c4" text-anchor="middle">×</text><rect x="186" y="62" width="128" height="70" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="250" y="98" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="middle">8</text><text x="250" y="119" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">times a day</text><text x="328" y="106" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#93a0c4" text-anchor="middle">×</text><rect x="342" y="62" width="128" height="70" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="406" y="98" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="middle">21</text><text x="406" y="119" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">working days</text><text x="484" y="106" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#93a0c4" text-anchor="middle">÷</text><rect x="498" y="62" width="128" height="70" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="562" y="98" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="middle">60</text><text x="562" y="119" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">minutes</text><text x="640" y="106" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#93a0c4" text-anchor="middle">=</text><rect x="654" y="62" width="128" height="70" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="718" y="98" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#22e5ff" text-anchor="middle">33.6 h</text><text x="718" y="119" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">a month</text><rect x="30" y="160" width="128" height="70" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="94" y="196" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#22e5ff" text-anchor="middle">33.6 h</text><text x="94" y="217" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">a month</text><text x="172" y="204" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#93a0c4" text-anchor="middle">×</text><rect x="186" y="160" width="128" height="70" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="250" y="196" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="middle">PLN 68</text><text x="250" y="217" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">true hourly rate</text><text x="328" y="204" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#93a0c4" text-anchor="middle">=</text><rect x="342" y="160" width="160" height="70" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="422" y="196" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#ff4d8d" text-anchor="middle">PLN 2,285</text><text x="422" y="217" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">a month</text><text x="522" y="190" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">for one process, one person,</text><text x="522" y="208" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">before you count errors.</text><text x="30" y="262" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">True rate: pay plus employer contributions, leave, sick pay, equipment and desk. PLN 6,000 net comes to PLN 60–70 an hour.</text>
</g>
