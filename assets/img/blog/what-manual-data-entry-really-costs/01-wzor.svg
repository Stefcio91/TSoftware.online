<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 285" width="800" height="285" role="img" aria-label="Cost formula for a manual process" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
