<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Cost of three manual processes" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="gly3smh-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="gly3smh-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="gly3smh-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="gly3smh-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="gly3smh-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="gly3smh-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="gly3smh-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="gly3smh-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="gly3smh-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="gly3smh-frame"><rect width="800" height="280" rx="18"/></clipPath>
</defs>
<g clip-path="url(#gly3smh-frame)">
  <rect width="800" height="280" fill="#0b1222"/>
  <rect width="800" height="280" fill="url(#gly3smh-grid)"/>
  <rect width="800" height="280" fill="url(#gly3smh-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">THREE PROCESSES FROM ONE TRADING COMPANY (14 PEOPLE)</text><text x="30" y="84.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Email orders into ERP</text><rect x="280" y="66" width="400" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="280" y="66" width="354" height="26" rx="6" fill="url(#gly3smh-neonbar)"/><text x="646" y="84.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">33.6 h · PLN 2,300</text><text x="30" y="126.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Cost invoices to accounting</text><rect x="280" y="108" width="400" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="280" y="108" width="332" height="26" rx="6" fill="url(#gly3smh-neonbar)"/><text x="624" y="126.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">31.5 h · PLN 2,200</text><text x="30" y="168.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Same customer questions</text><rect x="280" y="150" width="400" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="280" y="150" width="368" height="26" rx="6" fill="url(#gly3smh-neonbar)"/><text x="660" y="168.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">35 h · PLN 2,400</text><line x1="30" y1="200" x2="770" y2="200" stroke="rgba(255,255,255,0.18)"/><text x="30" y="230" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start">Total</text><text x="770" y="230" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ff4d8d" text-anchor="end">100 h · about PLN 6,900 a month</text><text x="30" y="254" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">Over half a full-time job spent retyping. The owner's guess: “two or three hours a week”.</text>
</g>
<rect x="0.5" y="0.5" width="799" height="279" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>