<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Matrix: which process to start with" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="gickfuc-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="gickfuc-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="gickfuc-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="gickfuc-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="gickfuc-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="gickfuc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="gickfuc-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="gickfuc-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="gickfuc-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="gickfuc-frame"><rect width="800" height="420" rx="18"/></clipPath>
</defs>
<g clip-path="url(#gickfuc-frame)">
  <rect width="800" height="420" fill="#0b1222"/>
  <rect width="800" height="420" fill="url(#gickfuc-grid)"/>
  <rect width="800" height="420" fill="url(#gickfuc-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">WHERE TO START: TWO QUESTIONS</text><rect x="430" y="70" width="310" height="150" rx="10" fill="#3ddc8418" stroke="#3ddc84" stroke-width="1"/><rect x="120" y="70" width="310" height="150" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="120" y="220" width="310" height="150" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="430" y="220" width="310" height="150" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="585" y="96" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#3ddc84" text-anchor="middle" letter-spacing="2">START HERE</text><text x="430" y="398" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="middle">data already in a system (email, shop, sheet) →</text><text x="102" y="220" font-size="13" fill="#93a0c4" text-anchor="middle" transform="rotate(-90 102 220)">repeats every day →</text><circle cx="470" cy="140" r="6" fill="#3ddc84"/><text x="482" y="145" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="start">orders from email</text><circle cx="470" cy="175" r="6" fill="#3ddc84"/><text x="482" y="180" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="start">cost invoices</text><circle cx="590" cy="195" r="6" fill="#3ddc84"/><text x="602" y="200" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="start">same customer questions</text><circle cx="160" cy="160" r="6" fill="#ffb547"/><text x="172" y="165" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="start">quotes from a rep's head</text><circle cx="470" cy="310" r="6" fill="#93a0c4"/><text x="482" y="315" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="start">yearly report for the bank</text><circle cx="160" cy="290" r="6" fill="#ff4d8d"/><text x="172" y="295" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="start">quoting a one-off project</text>
</g>
<rect x="0.5" y="0.5" width="799" height="419" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>