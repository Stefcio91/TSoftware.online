<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 679" width="800" height="679" role="img" aria-label="Sample customer conversation with the WhatsApp assistant" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="g1kspng4-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="g1kspng4-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="g1kspng4-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="g1kspng4-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="g1kspng4-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="g1kspng4-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="g1kspng4-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="g1kspng4-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="g1kspng4-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="g1kspng4-frame"><rect width="800" height="679" rx="18"/></clipPath>
</defs>
<g clip-path="url(#g1kspng4-frame)">
  <rect width="800" height="679" fill="#0b1222"/>
  <rect width="800" height="679" fill="url(#g1kspng4-grid)"/>
  <rect width="800" height="679" fill="url(#g1kspng4-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">A SATURDAY EVENING CONVERSATION, NO HUMAN INVOLVED</text><text x="400" y="80" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">Saturday 21:47</text><path d="M40 96 h364 a10 10 0 0 1 10 10 v48 a10 10 0 0 1 -10 10 h-364 l-10 0 l10 -10 v-48 a10 10 0 0 1 10 -10z" fill="rgba(255,255,255,0.07)"/><text x="44" y="118" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Hi, the AC in the living room is dripping</text><text x="44" y="139" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">from the indoor unit, what do I do??</text><text x="392" y="155" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">21:47</text><path d="M297 174 h463 a10 10 0 0 1 10 10 v106 a10 10 0 0 1 -10 10 h-463 a10 10 0 0 1 -10 -10 v-106 a10 10 0 0 1 10 -10z" fill="#1f4b3a"/><text x="311" y="194" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#22e5ff" text-anchor="start">Klima-Term Assistant</text><text x="311" y="212" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Hello. That's usually a blocked condensate drain,</text><text x="311" y="233" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">nothing serious. For now: switch the unit off and put</text><text x="311" y="254" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">something under it. I can book a visit: the earliest</text><text x="311" y="275" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">slot is Monday 8:00 or 13:30. Which works for you?</text><text x="758" y="291" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">21:47</text><path d="M40 310 h265 a10 10 0 0 1 10 10 v27 a10 10 0 0 1 -10 10 h-265 l-10 0 l10 -10 v-27 a10 10 0 0 1 10 -10z" fill="rgba(255,255,255,0.07)"/><text x="44" y="332" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">13:30. How much will it cost?</text><text x="293" y="348" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">21:49</text><path d="M272 367 h488 a10 10 0 0 1 10 10 v85 a10 10 0 0 1 -10 10 h-488 a10 10 0 0 1 -10 -10 v-85 a10 10 0 0 1 10 -10z" fill="#1f4b3a"/><text x="286" y="387" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#22e5ff" text-anchor="start">Klima-Term Assistant</text><text x="286" y="405" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Service visit with drain cleaning: PLN 249 incl. VAT</text><text x="286" y="426" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">(list price). If it turns out to be more, the technician</text><text x="286" y="447" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">will quote on site before starting. Your address?</text><text x="758" y="463" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">21:49</text><path d="M40 482 h175 a10 10 0 0 1 10 10 v27 a10 10 0 0 1 -10 10 h-175 l-10 0 l10 -10 v-27 a10 10 0 0 1 10 -10z" fill="rgba(255,255,255,0.07)"/><text x="44" y="504" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Lipowa 4, Świdnica</text><text x="203" y="520" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">21:50</text><path d="M305 539 h455 a10 10 0 0 1 10 10 v64 a10 10 0 0 1 -10 10 h-455 a10 10 0 0 1 -10 -10 v-64 a10 10 0 0 1 10 -10z" fill="#1f4b3a"/><text x="319" y="559" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#22e5ff" text-anchor="start">Klima-Term Assistant</text><text x="319" y="577" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Booked: Monday 13:30, Lipowa 4. I'll send a reminder</text><text x="319" y="598" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">on Sunday evening. Good night!</text><text x="758" y="614" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="end">21:50</text><text x="400" y="647" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">entry in Bartek's calendar · task in ERP · time from first message: 19 s</text>
</g>
<rect x="0.5" y="0.5" width="799" height="678" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>