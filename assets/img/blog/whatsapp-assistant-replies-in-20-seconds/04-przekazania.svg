<g clip-path="url(#gbx0t8z-frame)">
  <rect width="800" height="280" fill="#0b1222"/>
  <rect width="800" height="280" fill="url(#gbx0t8z-grid)"/>
  <rect width="800" height="280" fill="url(#gbx0t8z-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">THE LAST 100 CHATS: WHO CLOSED THEM</text><text x="30" y="84.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Assistant</text><rect x="300" y="66" width="380" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="300" y="66" width="380" height="26" rx="6" fill="url(#gbx0t8z-okbar)"/><text x="692" y="84.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">71</text><text x="30" y="126.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Human: quote not on the list</text><rect x="300" y="108" width="380" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="300" y="108" width="75" height="26" rx="6" fill="url(#gbx0t8z-pinkbar)"/><text x="387" y="126.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">14</text><text x="30" y="168.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Human: complaint, tempers</text><rect x="300" y="150" width="380" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="300" y="150" width="48" height="26" rx="6" fill="url(#gbx0t8z-pinkbar)"/><text x="360" y="168.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">9</text><text x="30" y="210.2" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#eef2ff" text-anchor="start">Human: “I want a human”</text><rect x="300" y="192" width="380" height="26" rx="6" fill="rgba(255,255,255,0.05)"/><rect x="300" y="192" width="32" height="26" rx="6" fill="url(#gbx0t8z-pinkbar)"/><text x="344" y="210.2" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="start">6</text><text x="30" y="250" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">Those 29 chats reach a human with a ready summary and address, so nobody starts from scratch.</text>
</g>
<rect x="0.5" y="0.5" width="799" height="279" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
