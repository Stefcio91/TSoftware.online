  <linearGradient id="gbx0t8z-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="gbx0t8z-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="gbx0t8z-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
