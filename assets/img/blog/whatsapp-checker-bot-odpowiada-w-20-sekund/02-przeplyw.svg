<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" width="800" height="345" role="img" aria-label="Przepływ wiadomości przez asystenta" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="g4varbk-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="g4varbk-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="g4varbk-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="g4varbk-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="g4varbk-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="g4varbk-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="g4varbk-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="g4varbk-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="g4varbk-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="g4varbk-frame"><rect width="800" height="345" rx="18"/></clipPath>
</defs>
<g clip-path="url(#g4varbk-frame)">
  <rect width="800" height="345" fill="#0b1222"/>
  <rect width="800" height="345" fill="url(#g4varbk-grid)"/>
  <rect width="800" height="345" fill="url(#g4varbk-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">CO SIĘ DZIEJE MIĘDZY WIADOMOŚCIĄ A ODPOWIEDZIĄ</text><rect x="30" y="70" width="130" height="70" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="44" y="70" width="102" height="3" rx="1.5" fill="#78a2ff"/><text x="95" y="98.25" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="middle">Wiadomość</text><text x="95" y="123.45" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">tekst, głosówka, zdjęcie</text><path d="M162 105 L198 105" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g4varbk-arr)"/><rect x="202" y="70" width="170" height="70" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="216" y="70" width="142" height="3" rx="1.5" fill="#a78bfa"/><text x="287" y="90.05" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#eef2ff" text-anchor="middle">Głosówka →</text><text x="287" y="106.05" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#eef2ff" text-anchor="middle">transkrypcja</text><text x="287" y="128.25" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">zdjęcie → opis usterki</text><path d="M374 105 L410 105" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g4varbk-arr)"/><rect x="414" y="70" width="160" height="70" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="428" y="70" width="132" height="3" rx="1.5" fill="#22e5ff"/><text x="494" y="98.25" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="middle">Intencja</text><text x="494" y="123.45" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">awaria · termin · cena · inne</text><path d="M576 105 L612 105" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g4varbk-arr)"/><rect x="616" y="70" width="154" height="70" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="630" y="70" width="126" height="3" rx="1.5" fill="#22e5ff"/><text x="693" y="89.625" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">Cennik · kalendarz</text><text x="693" y="105.625" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">· baza usterek</text><text x="693" y="127.825" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">tylko stamtąd bierze fakty</text><path d="M693 142 C 613 142, 320 200, 240 200" fill="none" stroke="#3ddc84" stroke-width="2" marker-end="url(#g4varbk-arr)"/><path d="M693 142 C 653 142, 600 200, 560 200" fill="none" stroke="#ffb547" stroke-width="2" marker-end="url(#g4varbk-arr)"/><rect x="60" y="204" width="360" height="84" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="74" y="204" width="332" height="3" rx="1.5" fill="#3ddc84"/><text x="240" y="231.25" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="middle">Odpowiada sam (71 % rozmów)</text><text x="240" y="256.55" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">awaria z bazy usterek, wolny termin z kalendarza,</text><text x="240" y="271.55" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">cena z cennika; po 20 s u klienta</text><rect x="440" y="204" width="330" height="84" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="454" y="204" width="302" height="3" rx="1.5" fill="#ffb547"/><text x="605" y="231.25" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="middle">Oddaje człowiekowi (29 %)</text><text x="605" y="256.55" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">cena spoza cennika, reklamacja, klient zły,</text><text x="605" y="271.55" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="middle">albo pisze „chcę z człowiekiem”</text><text x="30" y="322" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">Zasada numer jeden po wpadce z ceną: asystent nie podaje żadnej liczby, której nie znalazł w cenniku albo w kalendarzu.</text>
</g>
<rect x="0.5" y="0.5" width="799" height="344" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>