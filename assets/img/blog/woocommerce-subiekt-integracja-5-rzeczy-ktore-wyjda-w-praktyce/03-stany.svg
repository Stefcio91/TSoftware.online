  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">NIESPODZIANKA NR 2: OSTATNIA SZTUKA SPRZEDANA DWA RAZY</text><line x1="126" y1="72" x2="126" y2="300" stroke="rgba(255,255,255,0.18)" stroke-width="2"/><circle cx="126" cy="82" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="92" y="87" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">10:00:01</text><text x="150" y="88" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Zamówienie #5121: ostatni filtr PF-20 na stanie</text><text x="150" y="109" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">sklep pokazuje „1 szt.”, przyjmuje</text><circle cx="126" cy="144" r="9" fill="#0b1222" stroke="#ff4d8d" stroke-width="3"/><text x="92" y="149" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">10:00:03</text><text x="150" y="150" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Zamówienie #5122: ten sam filtr</text><text x="150" y="171" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff4d8d" text-anchor="start">sklep dalej pokazuje „1 szt.”, bo synchronizacja była o 9:58</text><circle cx="126" cy="206" r="9" fill="#0b1222" stroke="#ffb547" stroke-width="3"/><text x="92" y="211" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">10:02:00</text><text x="150" y="212" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Synchronizacja stanów: Subiekt → sklep</text><text x="150" y="233" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ffb547" text-anchor="start">stan 1 − 2 = −1. Dwóch klientów zapłaciło, towar jest jeden.</text><circle cx="126" cy="268" r="9" fill="#0b1222" stroke="#3ddc84" stroke-width="3"/><text x="92" y="273" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">potem</text><text x="150" y="274" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Rezerwacja w Subiekcie od razu po zamówieniu</text><text x="150" y="295" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#3ddc84" text-anchor="start">plus stany dla 60 „gorących” produktów co 30 s zamiast co 2 min</text>
</g>
