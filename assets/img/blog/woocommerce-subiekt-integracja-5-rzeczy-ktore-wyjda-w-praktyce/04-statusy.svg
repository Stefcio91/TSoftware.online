<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 352" width="800" height="352" role="img" aria-label="Mapowanie statusów sklepu na dokumenty w Subiekcie" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="g1wetlsp-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="g1wetlsp-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="g1wetlsp-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="g1wetlsp-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="g1wetlsp-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="g1wetlsp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="g1wetlsp-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="g1wetlsp-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="g1wetlsp-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="g1wetlsp-frame"><rect width="800" height="352" rx="18"/></clipPath>
</defs>
<g clip-path="url(#g1wetlsp-frame)">
  <rect width="800" height="352" fill="#0b1222"/>
  <rect width="800" height="352" fill="url(#g1wetlsp-grid)"/>
  <rect width="800" height="352" fill="url(#g1wetlsp-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">MAPA STATUSÓW (USTALONA W DNIU 4, ZMIENIONA W DNIU 9)</text><rect x="30" y="66" width="250" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="44" y="88" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#eef2ff" text-anchor="start">Oczekujące na płatność</text><path d="M284 83 L334 83" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g1wetlsp-arr)"/><rect x="338" y="66" width="432" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="#93a0c488" stroke-width="1"/><text x="352" y="88" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#93a0c4" text-anchor="start">ZK (zamówienie od klienta)</text><rect x="30" y="112" width="250" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="44" y="134" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#eef2ff" text-anchor="start">Przetwarzane</text><path d="M284 129 L334 129" fill="none" stroke="#22e5ff" stroke-width="2" marker-end="url(#g1wetlsp-arr)"/><rect x="338" y="112" width="432" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="#22e5ff88" stroke-width="1"/><text x="352" y="134" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#22e5ff" text-anchor="start">ZK + rezerwacja towaru</text><rect x="30" y="158" width="250" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="44" y="180" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#eef2ff" text-anchor="start">Zrealizowane</text><path d="M284 175 L334 175" fill="none" stroke="#3ddc84" stroke-width="2" marker-end="url(#g1wetlsp-arr)"/><rect x="338" y="158" width="432" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="#3ddc8488" stroke-width="1"/><text x="352" y="180" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#3ddc84" text-anchor="start">FS (faktura) + WZ, numer wraca do sklepu</text><rect x="30" y="204" width="250" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="44" y="226" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#eef2ff" text-anchor="start">Zwrócone</text><path d="M284 221 L334 221" fill="none" stroke="#ffb547" stroke-width="2" marker-end="url(#g1wetlsp-arr)"/><rect x="338" y="204" width="432" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="#ffb54788" stroke-width="1"/><text x="352" y="226" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#ffb547" text-anchor="start">korekta FS, towar wraca na stan</text><rect x="30" y="250" width="250" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="44" y="272" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#eef2ff" text-anchor="start">Anulowane</text><path d="M284 267 L334 267" fill="none" stroke="#ff4d8d" stroke-width="2" marker-end="url(#g1wetlsp-arr)"/><rect x="338" y="250" width="432" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="#ff4d8d88" stroke-width="1"/><text x="352" y="272" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#ff4d8d" text-anchor="start">ZK anulowane, rezerwacja zwolniona</text><text x="30" y="312" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">Zmiana z dnia 9: klient, który zmienił adres po złożeniu zamówienia, dostawał WZ ze starym adresem.</text><text x="30" y="330" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">Teraz adres idzie do Subiekta dopiero przy statusie „Zrealizowane”.</text>
</g>
<rect x="0.5" y="0.5" width="799" height="351" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>