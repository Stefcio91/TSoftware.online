<g clip-path="url(#glk4se5-frame)">
  <rect width="800" height="362" fill="#0b1222"/>
  <rect width="800" height="362" fill="url(#glk4se5-grid)"/>
  <rect width="800" height="362" fill="url(#glk4se5-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">WHAT FLOWS WHICH WAY</text><rect x="30" y="90" width="190" height="200" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="44" y="90" width="162" height="3" rx="1.5" fill="#a78bfa"/><text x="125" y="174.8" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#eef2ff" text-anchor="middle">WooCommerce</text><text x="125" y="204.20000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">shop, cart, payments</text><text x="125" y="220.20000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">Przelewy24, couriers</text><rect x="580" y="90" width="190" height="200" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="594" y="90" width="162" height="3" rx="1.5" fill="#22e5ff"/><text x="675" y="174.8" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#eef2ff" text-anchor="middle">Subiekt GT</text><text x="675" y="204.20000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">stock, invoices, prices</text><text x="675" y="220.20000000000002" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="middle">via the Sfera add-on</text><rect x="300" y="150" width="200" height="80" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="314" y="150" width="172" height="3" rx="1.5" fill="#78a2ff"/><text x="400" y="183.25" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#eef2ff" text-anchor="middle">Integrator</text><text x="400" y="208.45" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#93a0c4" text-anchor="middle">n8n + Sfera script, every 2 min</text><line x1="222" y1="112" x2="578" y2="112" stroke="#a78bfa" stroke-width="2" marker-end="url(#glk4se5-arr)" stroke-opacity="0.9"/><rect x="340.4" y="101" width="119.2" height="22" rx="11" fill="#0b1222" stroke="#a78bfa" stroke-width="1"/><text x="400" y="116" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#a78bfa" text-anchor="middle">orders + payment</text><line x1="578" y1="136" x2="222" y2="136" stroke="#22e5ff" stroke-width="2" marker-end="url(#glk4se5-arr-neon)" stroke-opacity="0.9"/><rect x="352.8" y="125" width="94.4" height="22" rx="11" fill="#0b1222" stroke="#22e5ff" stroke-width="1"/><text x="400" y="140" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#22e5ff" text-anchor="middle">stock levels</text><line x1="578" y1="250" x2="222" y2="250" stroke="#22e5ff" stroke-width="2" marker-end="url(#glk4se5-arr-neon)" stroke-opacity="0.9"/><rect x="337.3" y="239" width="125.4" height="22" rx="11" fill="#0b1222" stroke="#22e5ff" stroke-width="1"/><text x="400" y="254" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#22e5ff" text-anchor="middle">prices, new items</text><line x1="222" y1="274" x2="578" y2="274" stroke="#a78bfa" stroke-width="2" marker-end="url(#glk4se5-arr)" stroke-opacity="0.9"/><rect x="321.8" y="263" width="156.4" height="22" rx="11" fill="#0b1222" stroke="#a78bfa" stroke-width="1"/><text x="400" y="278" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#a78bfa" text-anchor="middle">status, invoice number</text><text x="30" y="322" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">Four streams, each on its own schedule: orders and stock every 2 minutes, prices once an hour,</text><text x="30" y="340" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">invoices right after a status change.</text>
</g>
<rect x="0.5" y="0.5" width="799" height="361" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
