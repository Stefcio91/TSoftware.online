  <filter id="glk4se5-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="glk4se5-frame"><rect width="800" height="362" rx="18"/></clipPath>
