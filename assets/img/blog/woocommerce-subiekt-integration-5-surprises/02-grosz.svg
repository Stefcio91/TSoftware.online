<g clip-path="url(#g14em9i6-frame)">
  <rect width="800" height="325" fill="#0b1222"/>
  <rect width="800" height="325" fill="url(#g14em9i6-grid)"/>
  <rect width="800" height="325" fill="url(#g14em9i6-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">SURPRISE NO. 1: ONE GROSZ</text><rect x="30" y="62" width="360" height="200" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="44" y="62" width="332" height="3" rx="1.5" fill="#a78bfa"/><text x="48" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start">WooCommerce (customer paid)</text><text x="48" y="122" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">3 × oil filter 41.15 gross</text><text x="372" y="122" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="end">123.45</text><text x="48" y="148" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">VAT on the total</text><text x="372" y="148" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="end">23.08</text><line x1="48" y1="160" x2="372" y2="160" stroke="rgba(255,255,255,0.18)"/><text x="48" y="182" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#eef2ff" text-anchor="start">Total gross</text><text x="372" y="182" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="end">PLN 123.45</text><text x="48" y="204" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="start">what the cart computed and what was paid</text><rect x="410" y="62" width="360" height="200" rx="12" fill="#121d3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="424" y="62" width="332" height="3" rx="1.5" fill="#ff4d8d"/><text x="428" y="92" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="start">Subiekt (invoice from net)</text><text x="428" y="122" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">3 × 33.46 net</text><text x="752" y="122" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="end">100.38</text><text x="428" y="148" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">VAT 23% per line</text><text x="752" y="148" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="end">23.09</text><line x1="428" y1="160" x2="752" y2="160" stroke="rgba(255,255,255,0.18)"/><text x="428" y="182" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#eef2ff" text-anchor="start">Total gross</text><text x="752" y="182" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ff4d8d" text-anchor="end">PLN 123.46</text><text x="428" y="204" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#93a0c4" text-anchor="start">one grosz over the payment: invoice “unpaid”</text><text x="30" y="300" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">Fix: the integrator passes gross prices line by line and forces Subiekt to calculate “from gross”, the same way the shop does.</text>
</g>
