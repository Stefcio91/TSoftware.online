<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" width="800" height="345" role="img" aria-label="Race for the last unit in stock" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="gu5j53h-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="gu5j53h-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="gu5j53h-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="gu5j53h-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="gu5j53h-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="gu5j53h-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="gu5j53h-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="gu5j53h-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="gu5j53h-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="gu5j53h-frame"><rect width="800" height="345" rx="18"/></clipPath>
</defs>
<g clip-path="url(#gu5j53h-frame)">
  <rect width="800" height="345" fill="#0b1222"/>
  <rect width="800" height="345" fill="url(#gu5j53h-grid)"/>
  <rect width="800" height="345" fill="url(#gu5j53h-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">SURPRISE NO. 2: THE LAST UNIT SOLD TWICE</text><line x1="126" y1="72" x2="126" y2="300" stroke="rgba(255,255,255,0.18)" stroke-width="2"/><circle cx="126" cy="82" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="92" y="87" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">10:00:01</text><text x="150" y="88" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Order #5121: the last PF-20 filter in stock</text><text x="150" y="109" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">shop shows “1 in stock”, accepts</text><circle cx="126" cy="144" r="9" fill="#0b1222" stroke="#ff4d8d" stroke-width="3"/><text x="92" y="149" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">10:00:03</text><text x="150" y="150" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Order #5122: the same filter</text><text x="150" y="171" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff4d8d" text-anchor="start">shop still shows “1 in stock”, last sync was at 9:58</text><circle cx="126" cy="206" r="9" fill="#0b1222" stroke="#ffb547" stroke-width="3"/><text x="92" y="211" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">10:02:00</text><text x="150" y="212" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Stock sync: Subiekt → shop</text><text x="150" y="233" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ffb547" text-anchor="start">stock 1 − 2 = −1. Two customers paid, there is one item.</text><circle cx="126" cy="268" r="9" fill="#0b1222" stroke="#3ddc84" stroke-width="3"/><text x="92" y="273" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">fix</text><text x="150" y="274" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Reservation in Subiekt right after the order</text><text x="150" y="295" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#3ddc84" text-anchor="start">plus stock for 60 “hot” products every 30 s instead of 2 min</text>
</g>
<rect x="0.5" y="0.5" width="799" height="344" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>