<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 352" width="800" height="352" role="img" aria-label="Mapping shop statuses to Subiekt documents" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <pattern id="g78yids-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/></pattern>
  <radialGradient id="g78yids-glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3f6ff5" stop-opacity="0.35"/><stop offset="1" stop-color="#3f6ff5" stop-opacity="0"/></radialGradient>
  <linearGradient id="g78yids-neonbar" x1="0" x2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#78a2ff"/></linearGradient>
  <linearGradient id="g78yids-pinkbar" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8aa6"/></linearGradient>
  <linearGradient id="g78yids-okbar" x1="0" x2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#9ef0c0"/></linearGradient>
  <marker id="g78yids-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a0c4"/></marker>
  <marker id="g78yids-arr-neon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22e5ff"/></marker>
  <marker id="g78yids-arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4d8d"/></marker>
  <filter id="g78yids-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="g78yids-frame"><rect width="800" height="352" rx="18"/></clipPath>
</defs>
<g clip-path="url(#g78yids-frame)">
  <rect width="800" height="352" fill="#0b1222"/>
  <rect width="800" height="352" fill="url(#g78yids-grid)"/>
  <rect width="800" height="352" fill="url(#g78yids-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">STATUS MAP (AGREED ON DAY 4, CHANGED ON DAY 9)</text><rect x="30" y="66" width="250" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="44" y="88" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#eef2ff" text-anchor="start">Pending payment</text><path d="M284 83 L334 83" fill="none" stroke="#93a0c4" stroke-width="2" marker-end="url(#g78yids-arr)"/><rect x="338" y="66" width="432" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="#93a0c488" stroke-width="1"/><text x="352" y="88" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#93a0c4" text-anchor="start">ZK (customer order)</text><rect x="30" y="112" width="250" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="44" y="134" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#eef2ff" text-anchor="start">Processing</text><path d="M284 129 L334 129" fill="none" stroke="#22e5ff" stroke-width="2" marker-end="url(#g78yids-arr)"/><rect x="338" y="112" width="432" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="#22e5ff88" stroke-width="1"/><text x="352" y="134" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#22e5ff" text-anchor="start">ZK + stock reservation</text><rect x="30" y="158" width="250" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="44" y="180" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#eef2ff" text-anchor="start">Completed</text><path d="M284 175 L334 175" fill="none" stroke="#3ddc84" stroke-width="2" marker-end="url(#g78yids-arr)"/><rect x="338" y="158" width="432" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="#3ddc8488" stroke-width="1"/><text x="352" y="180" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#3ddc84" text-anchor="start">FS (invoice) + WZ, number sent back to shop</text><rect x="30" y="204" width="250" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="44" y="226" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#eef2ff" text-anchor="start">Refunded</text><path d="M284 221 L334 221" fill="none" stroke="#ffb547" stroke-width="2" marker-end="url(#g78yids-arr)"/><rect x="338" y="204" width="432" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="#ffb54788" stroke-width="1"/><text x="352" y="226" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#ffb547" text-anchor="start">FS correction, goods back in stock</text><rect x="30" y="250" width="250" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><text x="44" y="272" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#eef2ff" text-anchor="start">Cancelled</text><path d="M284 267 L334 267" fill="none" stroke="#ff4d8d" stroke-width="2" marker-end="url(#g78yids-arr)"/><rect x="338" y="250" width="432" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="#ff4d8d88" stroke-width="1"/><text x="352" y="272" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#ff4d8d" text-anchor="start">ZK cancelled, reservation released</text><text x="30" y="312" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">Day 9 change: a customer who changed the address after ordering got a WZ with the old address.</text><text x="30" y="330" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#93a0c4" text-anchor="start">Now the address goes to Subiekt only at the “Completed” status.</text>
</g>
<rect x="0.5" y="0.5" width="799" height="351" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
</svg>