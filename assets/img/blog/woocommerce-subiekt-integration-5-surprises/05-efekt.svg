  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">AFTER TWO MONTHS</text><rect x="30" y="56" width="174.5" height="104" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="30" y="70" width="3" height="76" rx="1.5" fill="#3ddc84"/><text x="50" y="108" font-family="'Bricolage Grotesque','IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#3ddc84" text-anchor="start">0</text><text x="50" y="134" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="start">invoices issued by hand</text><text x="50" y="154" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start">was: about 40 a day</text><rect x="218.5" y="56" width="174.5" height="104" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="218.5" y="70" width="3" height="76" rx="1.5" fill="#22e5ff"/><text x="238.5" y="108" font-family="'Bricolage Grotesque','IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#22e5ff" text-anchor="start">30 s</text><text x="238.5" y="134" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="start">stock delay</text><text x="238.5" y="154" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start">was: once a day, morning</text><rect x="407" y="56" width="174.5" height="104" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="407" y="70" width="3" height="76" rx="1.5" fill="#ffb547"/><text x="427" y="108" font-family="'Bricolage Grotesque','IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffb547" text-anchor="start">11 days</text><text x="427" y="134" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="start">to deliver</text><text x="427" y="154" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start">plan: 8</text><rect x="595.5" y="56" width="174.5" height="104" rx="12" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="595.5" y="70" width="3" height="76" rx="1.5" fill="#ff4d8d"/><text x="615.5" y="108" font-family="'Bricolage Grotesque','IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#ff4d8d" text-anchor="start">5</text><text x="615.5" y="134" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#eef2ff" text-anchor="start">surprises along the way</text><text x="615.5" y="154" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start">all of them in this post</text>
