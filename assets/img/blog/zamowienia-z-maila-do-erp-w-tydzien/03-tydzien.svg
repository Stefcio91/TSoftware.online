<g clip-path="url(#gx0krll-frame)">
  <rect width="800" height="560" fill="#0b1222"/>
  <rect width="800" height="560" fill="url(#gx0krll-grid)"/>
  <rect width="800" height="560" fill="url(#gx0krll-glow)"/>
  <text x="30" y="40" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#93a0c4" text-anchor="start" letter-spacing="1.6">PLAN: 7 DNI. WYSZŁO: 9.</text><line x1="118" y1="72" x2="118" y2="516" stroke="rgba(255,255,255,0.18)" stroke-width="2"/><circle cx="118" cy="82" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="87" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">dzień 1</text><text x="142" y="88" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Przegląd 30 ostatnich zamówień</text><text x="142" y="109" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="start">spisane 7 typów wyjątków, m.in. „to co ostatnio”</text><circle cx="118" cy="140" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="145" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">dzień 2</text><text x="142" y="146" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Dostępy, pierwszy przepływ na bazie testowej</text><circle cx="118" cy="198" r="9" fill="#0b1222" stroke="#ff4d8d" stroke-width="3"/><text x="84" y="203" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">dzień 3</text><text x="142" y="204" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Pierwsze prawdziwe maile</text><text x="142" y="225" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff4d8d" text-anchor="start">skany PDF: AI czyta 60 % pozycji. Dokładamy OCR, dzień w plecy.</text><circle cx="118" cy="256" r="9" fill="#0b1222" stroke="#ffb547" stroke-width="3"/><text x="84" y="261" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">dzień 4</text><text x="142" y="262" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Porównanie z tym, co wpisał człowiek</text><text x="142" y="283" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ffb547" text-anchor="start">rabaty „w głowie” handlowca. Najpierw cennik do Optimy.</text><circle cx="118" cy="314" r="9" fill="#0b1222" stroke="#78a2ff" stroke-width="3"/><text x="84" y="319" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">dzień 5</text><text x="142" y="320" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Start na żywo z ręcznym zatwierdzaniem</text><circle cx="118" cy="372" r="9" fill="#0b1222" stroke="#ff4d8d" stroke-width="3"/><text x="84" y="377" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">dzień 6</text><text x="142" y="378" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Duplikat zamówienia</text><text x="142" y="399" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff4d8d" text-anchor="start">klient wysłał tego samego maila dwa razy. Dochodzi sprawdzanie duplikatów.</text><circle cx="118" cy="430" r="9" fill="#0b1222" stroke="#ff4d8d" stroke-width="3"/><text x="84" y="435" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">sobota</text><text x="142" y="436" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Token do API wygasł o 3:14</text><text x="142" y="457" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ff4d8d" text-anchor="start">kolejka stanęła na 5 godzin. Odnawianie tokenu i alarm na WhatsApp.</text><circle cx="118" cy="488" r="9" fill="#0b1222" stroke="#3ddc84" stroke-width="3"/><text x="84" y="493" font-family="'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#93a0c4" text-anchor="end">dzień 8–9</text><text x="142" y="494" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#eef2ff" text-anchor="start">Zdejmujemy zatwierdzanie dla 14 klientów</text><text x="142" y="515" font-family="'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#3ddc84" text-anchor="start">ci, którzy przez tydzień nie zrobili żadnej niespodzianki</text>
</g>
<rect x="0.5" y="0.5" width="799" height="559" rx="18" fill="none" stroke="rgba(255,255,255,0.18)"/>
